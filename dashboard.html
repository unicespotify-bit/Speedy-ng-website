<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07152f">
<title>Speedy.ng Dashboard</title>

<style>
:root {
  --bg:#06132c;
  --panel:#10284b;
  --blue:#287cff;
  --cyan:#55dcff;
  --text:#f5f9ff;
  --muted:#a6bbd9;
  --green:#42dfa0;
  --red:#ff718b;
}

*{box-sizing:border-box}

body {
  margin:0;
  padding-bottom:90px;
  min-height:100vh;
  color:var(--text);
  background:var(--bg);
  font-family:Arial,sans-serif;
}

button,input,select{font:inherit}
button{cursor:pointer}

header {
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand {
  font-size:26px;
  font-weight:900;
}

.brand span{color:var(--cyan)}

.profile {
  background:#17477e;
  color:white;
  border:0;
  border-radius:50%;
  padding:12px;
}

main {
  max-width:850px;
  margin:auto;
  padding:12px 16px;
}

.welcome{padding:15px 0}

h1{font-size:27px;margin:10px 0}

h2{font-size:17px}

.muted {
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}

.section-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:24px 0 12px;
}

.wallets,.services,.actions {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.wallet {
  background:linear-gradient(140deg,#1b59a4,#102b54);
  border:1px solid #3979bd;
  border-radius:18px;
  padding:17px;
  min-height:135px;
}

.wallet.usd {
  background:linear-gradient(140deg,#17617a,#102b54);
}

.wallet-value {
  font-size:23px;
  font-weight:900;
  margin:18px 0 8px;
  overflow-wrap:anywhere;
}

.action,.service {
  background:var(--panel);
  border:1px solid #315783;
  border-radius:15px;
  padding:16px 10px;
  color:white;
  text-align:center;
  min-height:85px;
}

.service {
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
}

.service strong{font-size:13px}

.service small {
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:5px;
}

.panel {
  background:var(--panel);
  border:1px solid #315783;
  border-radius:16px;
  padding:14px;
}

.tx {
  padding:12px 0;
  border-bottom:1px solid #315783;
  font-size:12px;
}

.primary {
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:linear-gradient(90deg,#287cff,#159fe4);
  color:white;
  font-weight:900;
  margin-top:12px;
}

.secondary {
  padding:11px;
  border:0;
  border-radius:10px;
  background:#214674;
  color:white;
  margin-top:10px;
}

.modal-back {
  position:fixed;
  inset:0;
  z-index:10;
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:10px;
  background:#020916e8;
}

.modal-back.show{display:flex}

.modal {
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto;
  background:#10284b;
  border:1px solid #42618c;
  border-radius:20px;
  padding:18px;
}

.modal input,.modal select {
  width:100%;
  padding:13px;
  margin-top:8px;
  background:#071832;
  border:1px solid #42618c;
  border-radius:10px;
  color:white;
}

.close {
  float:right;
  background:#214674;
  color:white;
  border:0;
  border-radius:50%;
  padding:8px 12px;
}

.status {
  font-size:12px;
  color:var(--muted);
  margin-top:12px;
}

.good{color:var(--green)}
.danger{color:var(--red)}

.bottom {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#071832;
  border-top:1px solid #315783;
  display:flex;
  justify-content:space-around;
  padding:13px 5px;
}

.bottom button {
  background:none;
  border:0;
  color:var(--cyan);
  font-size:11px;
}

@media(max-width:370px) {
  .wallet-value{font-size:19px}
  .service{padding:10px 6px}
}
</style>
</head>

<body>

<header>
  <div class="brand">Speedy<span>.ng</span></div>
  <button class="profile" id="profileBtn">👤</button>
</header>

<main>

<section class="welcome">
  <div class="muted">YOUR DIGITAL SERVICES HUB</div>
  <h1>Welcome back 👋</h1>
  <div class="muted" id="email">Loading account...</div>
</section>

<div class="section-head">
  <h2>My Wallet</h2>
  <button id="refreshBtn">↻ Refresh</button>
</div>

<section class="wallets">
  <div class="wallet">
    <div>🇳🇬 Naira Balance</div>
    <div class="wallet-value" id="ngn">₦0.00</div>
    <small>NGN Wallet</small>
  </div>

  <div class="wallet usd">
    <div>🇺🇸 Dollar Balance</div>
    <div class="wallet-value" id="usd">$0.00</div>
    <small>USD Wallet</small>
  </div>
</section>

<div class="section-head">
  <h2>Quick Actions</h2>
</div>

<section class="actions">
  <button class="action" id="depositOpen">＋ Deposit</button>
  <button class="action" id="convertOpen">⇄ Convert</button>
</section>

<div class="section-head">
  <h2>Explore Services</h2>
</div>

<section class="services">
  <button class="service" id="numbersOpen">
    📱 <span><strong>Buy Numbers</strong>
    <small>Visual Numbers</small></span>
  </button>

  <button class="service" id="boostOpen">
    🚀 <span><strong>Social Boosting</strong>
    <small>Social media services</small></span>
  </button>

  <button class="service" id="logsOpen">
    📁 <span><strong>Social Logs</strong>
    <small>Browse listings</small></span>
  </button>
</section>

<div class="section-head">
  <h2>Recent Transactions</h2>
  <button id="txRefresh">Refresh</button>
</div>

<section class="panel" id="transactionList">
  <div class="muted">Loading transactions...</div>
</section>

<div class="status" id="pageStatus">
  Connecting securely...
</div>

</main>

<nav class="bottom">
  <button onclick="window.scrollTo(0,0)">⌂ Home</button>
  <button onclick="document.getElementById('numbersOpen').scrollIntoView()">Services</button>
  <button onclick="document.getElementById('transactionList').scrollIntoView()">Activity</button>
  <button id="navProfile">Profile</button>
</nav>

<div class="modal-back" id="modalBack">
  <section class="modal">
    <button class="close" id="closeModal">×</button>
    <h3 id="modalTitle">Speedy.ng</h3>
    <p class="muted" id="modalIntro"></p>
    <div id="modalBody"></div>
    <div class="status" id="modalStatus"></div>
  </section>
</div>

<script>
const API = "https://speedy-ng-api-staging.unicespotify.workers.dev";
const $ = id => document.getElementById(id);

let customer = null;
let wallet = {ngn:0, usd:0};
let numberCountries = [];
let numberServices = [];
let selectedCountry = "";
let selectedService = "";
let selectedQuote = null;
let numberOrders = [];
let socialCategories = [];
let socialListings = [];
let boostServices = [];
let selectedLog = null;
let selectedBoost = null;

function token(){
  return localStorage.getItem("speedy_customer_token") ||
         sessionStorage.getItem("speedy_customer_token") || "";
}

async function api(path, method="GET", body=null, extra={}){
  const headers = {
    "Authorization":"Bearer "+token(),
    "Content-Type":"application/json",
    ...extra
  };

  const options = {method, headers};
  if(body) options.body = JSON.stringify(body);

  const response = await fetch(API+path, options);
  const data = await response.json().catch(()=>({}));

  if(!response.ok){
    throw new Error(data.message || data.error || "Request failed.");
  }
  return data;
}

function unwrap(data, key){
  if(key && data && data[key] !== undefined) return data[key];
  if(data && data.data !== undefined) return data.data;
  return data;
}

function money(value, currency="NGN"){
  const amount = Number(value || 0);
  return new Intl.NumberFormat("en-NG",{
    style:"currency", currency, maximumFractionDigits:2
  }).format(amount);
}

function minor(value){
  return Number(value || 0)/100;
}

function showStatus(message, error=false){
  const box = $("pageStatus");
  if(!box) return;
  box.textContent = message;
  box.style.color = error ? "#ff7777" : "#42e6b0";
}

function modal(title, intro="", html=""){
  $("modalTitle").textContent = title;
  $("modalIntro").textContent = intro;
  $("modalBody").innerHTML = html;
  $("modalStatus").textContent = "";
  $("modalBack").classList.add("show");
}

function closeModal(){
  $("modalBack").classList.remove("show");
}

$("closeModal").onclick = closeModal;
$("modalBack").addEventListener("click", e=>{
  if(e.target === $("modalBack")) closeModal();
});

async function loadProfile(){
  const data = await api("/api/customer/me");
  customer = unwrap(data,"customer") || unwrap(data);
  const email = customer.email || "";
  $("email").textContent = email;
}

async function loadWallet(){
  const data = await api("/api/customer/wallet");
  const w = unwrap(data,"wallet") || unwrap(data);
  wallet.ngn = Number(w.ngn_balance ?? w.ngn ?? 0);
  wallet.usd = Number(w.usd_balance ?? w.usd ?? 0);

  $("ngn").textContent = money(wallet.ngn);
  $("usd").textContent = money(wallet.usd,"USD");
}

async function loadTransactions(){
  const box = $("transactionList");
  box.innerHTML = "<p>Loading transactions...</p>";

  try{
    const data = await api("/api/customer/wallet/transactions");
    const rows = unwrap(data,"transactions") || [];
    if(!rows.length){
      box.innerHTML = "<p>No transactions yet.</p>";
      return;
    }

    box.innerHTML = rows.slice(0,12).map(t=>`
      <div class="transaction-row">
        <strong>${t.description || t.type || "Wallet transaction"}</strong>
        <span>${money(minor(t.amount_minor),t.currency || "NGN")}</span>
        <small>${t.status || ""}</small>
      </div>
    `).join("");
  }catch(e){
    box.innerHTML = "<p>Could not load transactions.</p>";
  }
}

async function refreshDashboard(){
  try{
    await Promise.all([loadProfile(),loadWallet()]);
    await loadTransactions();
    showStatus("Your account is up to date.");
  }catch(e){
    showStatus(e.message,true);
  }
}

$("refreshBtn").onclick = refreshDashboard;
$("txRefresh").onclick = loadTransactions;

$("depositOpen").onclick = ()=>{
  modal("Add Money","Choose the amount you want to deposit.",`
    <label>Amount in Naira</label>
    <input id="depositAmount" type="number" min="100" max="5000000" placeholder="Enter amount">
    <button class="primary-btn" id="startDeposit">Continue to Payment</button>
  `);

  $("startDeposit").onclick = async ()=>{
    const amount = Number($("depositAmount").value);
    if(amount < 100 || amount > 5000000){
      $("modalStatus").textContent = "Minimum ₦100. Maximum ₦5,000,000.";
      return;
    }

    try{
      $("startDeposit").disabled = true;
      const result = await api("/api/customer/wallet/deposit","POST",{
        amount_minor:Math.round(amount*100),
        currency:"NGN"
      });

      const checkout = result.checkout_url ||
        result.payment_link ||
        result.data?.checkout_url;

      if(checkout){
        window.location.href = checkout;
      }else{
        $("modalStatus").textContent =
          result.message || "Payment link was not returned. Please try again.";
      }
    }catch(e){
      $("modalStatus").textContent = e.message;
    }finally{
      $("startDeposit").disabled = false;
    }
  };
};

$("convertOpen").onclick = ()=>{
  modal("Convert Wallet","Convert between your Naira and Dollar wallets.",`
    <label>Conversion direction</label>
    <select id="convertDirection">
      <option value="NGN_TO_USD">Naira to Dollar</option>
      <option value="USD_TO_NGN">Dollar to Naira</option>
    </select>
    <label>Amount</label>
    <input id="convertAmount" type="number" min="1" placeholder="Enter amount">
    <button class="primary-btn" id="convertNow">Convert Wallet</button>
  `);

  $("convertNow").onclick = async ()=>{
    const amount = Number($("convertAmount").value);
    const direction = $("convertDirection").value;
    if(!amount || amount <= 0){
      $("modalStatus").textContent = "Enter a valid amount.";
      return;
    }

    try{
      $("convertNow").disabled = true;
      await api("/api/customer/wallet/convert","POST",{
        direction, amount
      });
      $("modalStatus").textContent = "Conversion completed.";
      await loadWallet();
    }catch(e){
      $("modalStatus").textContent = e.message;
    }finally{
      $("convertNow").disabled = false;
    }
  };
};

async function logout(){
  try{ await api("/api/customer/logout","POST",{}); }catch(e){}
  localStorage.removeItem("speedy_customer_token");
  sessionStorage.removeItem("speedy_customer_token");
  window.location.href = "login.html";
}

$("profileBtn").onclick = ()=>{
  modal("My Account","Your Speedy.ng account.",`
    <p>${customer?.email || ""}</p>
    <button class="primary-btn" id="logoutNow">Log Out</button>
  `);
  $("logoutNow").onclick = logout;
};

$("navProfile").onclick = ()=> $("profileBtn").click();

</script>
<script>
async function loadNumberCountries(){
  const data = await api("/api/customer/visual-numbers/countries");
  numberCountries = unwrap(data,"countries") || [];
}

async function loadNumberServices(){
  const data = await api("/api/customer/visual-numbers/services");
  numberServices = unwrap(data,"services") || [];
}

function openNumbers(){
  modal("Buy Numbers","Choose a country and service.",`
    <label>Search country</label>
    <input id="countrySearch" placeholder="Search country">
    <select id="countrySelect"><option value="">Choose country</option></select>

    <label>Search service</label>
    <input id="serviceSearch" placeholder="Search service">
    <select id="serviceSelect"><option value="">Choose service</option></select>

    <div id="numberQuote"></div>
    <button class="primary-btn" id="getQuote">Check Price & Availability</button>
    <button class="secondary-btn" id="numberHistory">Order History</button>
  `);

  loadNumberCountries().then(renderCountries).catch(showNumberError);
  loadNumberServices().then(renderServices).catch(showNumberError);

  $("countrySearch").oninput = renderCountries;
  $("serviceSearch").oninput = renderServices;

  $("countrySelect").onchange = ()=>{
    selectedCountry = $("countrySelect").value;
    selectedQuote = null;
    $("numberQuote").innerHTML = "";
  };

  $("serviceSelect").onchange = ()=>{
    selectedService = $("serviceSelect").value;
    selectedQuote = null;
    $("numberQuote").innerHTML = "";
  };

  $("getQuote").onclick = getNumberQuote;
  $("numberHistory").onclick = loadNumberHistory;
}

function renderCountries(){
  const search = $("countrySearch").value.toLowerCase();
  const rows = numberCountries.filter(x=>{
    const name = typeof x === "string" ? x : (x.name || x.country || "");
    return name.toLowerCase().includes(search);
  });

  $("countrySelect").innerHTML =
    '<option value="">Choose country</option>' +
    rows.map(x=>{
      const name = typeof x === "string" ? x : (x.name || x.country);
      return `<option value="${name}">${name}</option>`;
    }).join("");
}

function renderServices(){
  const search = $("serviceSearch").value.toLowerCase();
  const rows = numberServices.filter(x=>{
    const name = typeof x === "string" ? x : (x.name || x.service || "");
    return name.toLowerCase().includes(search);
  });

  $("serviceSelect").innerHTML =
    '<option value="">Choose service</option>' +
    rows.map(x=>{
      const name = typeof x === "string" ? x : (x.name || x.service);
      return `<option value="${name}">${name}</option>`;
    }).join("");
}

function showNumberError(e){
  $("numberQuote").textContent = e.message;
}

async function getNumberQuote(){
  selectedCountry = $("countrySelect").value;
  selectedService = $("serviceSelect").value;

  if(!selectedCountry || !selectedService){
    $("numberQuote").textContent = "Choose a country and service first.";
    return;
  }

  try{
    $("getQuote").disabled = true;
    const path = "/api/customer/visual-numbers/quote?country=" +
      encodeURIComponent(selectedCountry) +
      "&service=" + encodeURIComponent(selectedService);

    const data = await api(path);
    selectedQuote = unwrap(data,"quote") || unwrap(data);

    const stock = Number(selectedQuote.stock);
    const status = Number.isFinite(stock)
      ? (stock > 0 ? "ONLINE" : "OFFLINE")
      : "STATUS UNKNOWN";

    $("numberQuote").innerHTML = `
      <div class="service-card">
        <strong>${selectedCountry} — ${selectedService}</strong>
        <p>${money(minor(selectedQuote.customer_price_minor),"USD")}</p>
        <p>Availability: ${status}</p>
        <p>Available quantity: ${
          Number.isFinite(stock) ? stock : "Not confirmed"
        }</p>
        <button class="primary-btn" id="reviewNumber">Review Order</button>
      </div>
    `;

    $("reviewNumber").onclick = reviewNumberOrder;
  }catch(e){
    $("numberQuote").textContent = e.message;
  }finally{
    $("getQuote").disabled = false;
  }
}

function reviewNumberOrder(){
  if(!selectedQuote || Number(selectedQuote.stock) <= 0){
    $("modalStatus").textContent = "This service is not available.";
    return;
  }

  const price = money(minor(selectedQuote.customer_price_minor),"USD");

  $("numberQuote").innerHTML = `
    <div class="service-card">
      <h3>Confirm Your Order</h3>
      <p>Country: ${selectedCountry}</p>
      <p>Service: ${selectedService}</p>
      <p>Price: ${price}</p>
      <p>This amount will be deducted from your USD wallet.</p>
      <button class="primary-btn" id="confirmNumber">Confirm & Place Order</button>
    </div>
  `;

  $("confirmNumber").onclick = purchaseNumber;
}

async function purchaseNumber(){
  const button = $("confirmNumber");
  button.disabled = true;
  button.textContent = "Processing...";

  const key = crypto.randomUUID();

  try{
    const result = await api(
      "/api/customer/visual-numbers/purchase",
      "POST",
      {
        country:selectedQuote.country || selectedCountry,
        service:selectedQuote.service || selectedService,
        idempotency_key:key
      },
      {"Idempotency-Key":key}
    );

    const order = unwrap(result,"order") || unwrap(result);
    $("numberQuote").innerHTML = `
      <div class="service-card">
        <h3>Order Submitted</h3>
        <p>Order ID: ${order.id || "Processing"}</p>
        <p>${order.message || "Your order has been submitted."}</p>
      </div>
    `;
    await loadWallet();
    await loadTransactions();
  }catch(e){
    $("modalStatus").textContent = e.message;
    button.disabled = false;
    button.textContent = "Confirm & Place Order";
  }
}

async function loadNumberHistory(){
  $("numberQuote").innerHTML = "<p>Loading your orders...</p>";

  try{
    const data = await api("/api/customer/orders");
    const rows = data.orders || unwrap(data,"orders") || [];

    if(!rows.length){
      $("numberQuote").innerHTML = "<p>No orders found.</p>";
      return;
    }

    $("numberQuote").innerHTML = rows.map(o=>`
      <div class="service-card">
        <strong>${o.service || o.category || "Order"}</strong>
        <p>${o.country || ""}</p>
        <p>Status: ${o.status || "Pending"}</p>
        <p>Order ID: ${o.id}</p>
        <small>${o.created_at || ""}</small>
      </div>
    `).join("");
  }catch(e){
    $("numberQuote").textContent = e.message;
  }
}

$("numbersOpen").onclick = openNumbers;

</script>
<script>
async function openSocialLogs(){
  modal("Social Logs","Search available listings and select what you need.",`
    <input id="logSearch" placeholder="Search listings">
    <select id="logCategory"><option value="">All categories</option></select>
    <div id="logResults">Loading listings...</div>
  `);

  try{
    const data = await api("/api/customer/social-logs/categories");
    socialCategories = unwrap(data,"categories") || [];

    $("logCategory").innerHTML =
      '<option value="">All categories</option>' +
      socialCategories.map(c=>`
        <option value="${c.id}">${c.name || c.title}</option>
      `).join("");

    $("logSearch").oninput = loadSocialListings;
    $("logCategory").onchange = loadSocialListings;
    await loadSocialListings();
  }catch(e){
    $("logResults").textContent = e.message;
  }
}

async function loadSocialListings(){
  const search = $("logSearch").value;
  const category = $("logCategory").value;

  let path = "/api/customer/social-logs/listings?per_page=50&page=1";
  path += "&search="+encodeURIComponent(search);
  if(category) path += "&category_id="+encodeURIComponent(category);

  try{
    const data = await api(path);
    socialListings = unwrap(data,"listings") || [];

    $("logResults").innerHTML = socialListings.map((item,i)=>`
      <div class="service-card">
        <strong>${item.name || item.title || "Listing"}</strong>
        <p>${item.description || ""}</p>
        <p>${money(minor(item.price_minor),"USD")}</p>
        <button class="primary-btn" data-log="${i}">View Listing</button>
      </div>
    `).join("") || "<p>No listings found.</p>";

    document.querySelectorAll("[data-log]").forEach(button=>{
      button.onclick = ()=>showLogDetails(Number(button.dataset.log));
    });
  }catch(e){
    $("logResults").textContent = e.message;
  }
}

async function showLogDetails(index){
  selectedLog = socialListings[index];
  const slug = selectedLog.slug;
  if(!slug) return;

  try{
    const data = await api(
      "/api/customer/social-logs/listing?slug="+encodeURIComponent(slug)
    );
    selectedLog = unwrap(data,"listing") || unwrap(data);

    $("logResults").innerHTML = `
      <div class="service-card">
        <h3>${selectedLog.name || selectedLog.title || "Listing"}</h3>
        <p>${selectedLog.description || ""}</p>
        <p>Price: ${money(minor(selectedLog.price_minor),"USD")}</p>
        <button class="primary-btn" id="buyLog">Purchase Listing</button>
      </div>
    `;

    $("buyLog").onclick = purchaseSocialLog;
  }catch(e){
    $("logResults").textContent = e.message;
  }
}

async function purchaseSocialLog(){
  const button = $("buyLog");
  button.disabled = true;

  try{
    const result = await api("/api/customer/social-logs/purchase","POST",{
      listing_id:selectedLog.id,
      slug:selectedLog.slug
    });

    $("logResults").textContent =
      result.message || "Your purchase has been submitted.";
    await loadWallet();
    await loadTransactions();
  }catch(e){
    $("logResults").textContent = e.message;
    button.disabled = false;
  }
}

async function openBoost(){
  modal("Social Boosting","Find and select a boosting service.",`
    <select id="boostDriver">
      <option value="global">Global Services</option>
      <option value="nigerian">Nigerian Services</option>
    </select>
    <input id="boostSearch" placeholder="Search services">
    <div id="boostResults">Loading services...</div>
  `);

  $("boostDriver").onchange = loadBoostServices;
  $("boostSearch").oninput = renderBoostServices;
  await loadBoostServices();
}

async function loadBoostServices(){
  const driver = $("boostDriver").value;

  try{
    const data = await api(
      "/api/customer/social-boost/services?driver="+driver
    );
    boostServices = unwrap(data,"services") || [];
    renderBoostServices();
  }catch(e){
    $("boostResults").textContent = e.message;
  }
}

function renderBoostServices(){
  const search = $("boostSearch").value.toLowerCase();
  const rows = boostServices.filter(s=>
    (s.name || s.service || "").toLowerCase().includes(search)
  );

  $("boostResults").innerHTML = rows.map((s,i)=>`
    <div class="service-card">
      <strong>${s.name || s.service}</strong>
      <p>${s.description || ""}</p>
      <p>${money(minor(s.price_minor),"USD")}</p>
      <button class="primary-btn" data-boost="${i}">Select Service</button>
    </div>
  `).join("") || "<p>No services found.</p>";

  document.querySelectorAll("[data-boost]").forEach(button=>{
    button.onclick = ()=>selectBoost(Number(button.dataset.boost));
  });
}

function selectBoost(index){
  selectedBoost = boostServices[index];

  $("boostResults").innerHTML = `
    <div class="service-card">
      <h3>${selectedBoost.name || selectedBoost.service}</h3>
      <label>Target link</label>
      <input id="boostLink" placeholder="Paste your profile or post link">
      <label>Quantity</label>
      <input id="boostQuantity" type="number" min="1" placeholder="Enter quantity">
      <button class="primary-btn" id="buyBoost">Place Boosting Order</button>
    </div>
  `;

  $("buyBoost").onclick = purchaseBoost;
}

async function purchaseBoost(){
  const button = $("buyBoost");
  const link = $("boostLink").value.trim();
  const quantity = Number($("boostQuantity").value);

  if(!link || quantity < 1){
    $("boostResults").textContent = "Enter a valid link and quantity.";
    return;
  }

  button.disabled = true;

  try{
    const result = await api("/api/customer/social-boost/purchase","POST",{
      service_id:selectedBoost.id,
      service:selectedBoost.service,
      link,
      quantity,
      driver:$("boostDriver").value
    });

    $("boostResults").textContent =
      result.message || "Your boosting order has been submitted.";
    await loadWallet();
    await loadTransactions();
  }catch(e){
    $("boostResults").textContent = e.message;
    button.disabled = false;
  }
}

$("logsOpen").onclick = openSocialLogs;
$("boostOpen").onclick = openBoost;

async function startDashboard(){
  if(!token()){
    window.location.href = "login.html";
    return;
  }
  await refreshDashboard();
}

startDashboard();
</script>
</body>
</html>
