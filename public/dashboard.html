<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07152f">
<title>Speedy.ng | Customer Dashboard</title>

<style>
:root {
  --bg:#06132c;
  --panel:#0d2143;
  --panel2:#112c55;
  --line:#244875;
  --blue:#287cff;
  --cyan:#55dcff;
  --text:#f5f9ff;
  --muted:#a6bbd9;
  --green:#42dfa0;
  --red:#ff718b;
  --shadow:0 15px 40px #0005;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  color:var(--text);
  background:
    radial-gradient(ellipse at 90% 0%,#16477d 0,transparent 35%),
    radial-gradient(ellipse at 0% 50%,#102d58 0,transparent 35%),
    var(--bg);
  font-family:Inter,Arial,sans-serif;
  padding-bottom:100px;
  min-height:100vh;
}

button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}

.top{
  max-width:1100px;
  margin:auto;
  padding:18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  font-size:27px;
  font-weight:950;
  letter-spacing:-1.3px;
}

.brand span{color:var(--cyan)}

.profile{
  width:44px;
  height:44px;
  border-radius:50%;
  background:linear-gradient(145deg,#287cff,#17477e);
  border:1px solid #5c9bda;
  color:white;
  font-size:20px;
  box-shadow:0 0 20px #287cff44;
}

main{
  max-width:1100px;
  margin:auto;
  padding:8px 16px 35px;
}

.welcome{
  padding:16px 3px 20px;
}

.eyebrow{
  color:var(--cyan);
  font-size:11px;
  font-weight:900;
  letter-spacing:2px;
}

.welcome h1{
  font-size:29px;
  margin:10px 0 7px;
  letter-spacing:-.7px;
}

.muted{
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:25px 2px 13px;
}

.section-head h2{
  font-size:17px;
  margin:0;
}

.text-btn{
  background:transparent;
  color:var(--cyan);
  font-weight:800;
  font-size:12px;
  padding:8px;
}

.wallets{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.wallet{
  position:relative;
  overflow:hidden;
  background:linear-gradient(140deg,#1b59a4,#102b54 75%);
  border:1px solid #3979bd;
  border-radius:20px;
  padding:18px 15px;
  min-height:150px;
  box-shadow:var(--shadow);
}

.wallet.usd{
  background:linear-gradient(140deg,#17617a,#102b54 78%);
  border-color:#318ca8;
}

.wallet:after{
  content:"";
  position:absolute;
  width:145px;
  height:145px;
  border:1px solid #ffffff19;
  border-radius:50%;
  right:-55px;
  top:48px;
}

.wallet-label{
  font-size:12px;
  color:#d6e8ff;
}

.wallet-value{
  font-size:24px;
  font-weight:950;
  margin:16px 0 7px;
  overflow-wrap:anywhere;
}

.wallet-foot{
  font-size:11px;
  color:#c0d9f5;
}

.wallet-symbol{
  position:absolute;
  right:15px;
  top:14px;
  font-size:23px;
}

.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:11px;
}

.action{
  background:linear-gradient(145deg,#122d55,#0c2040);
  border:1px solid var(--line);
  border-radius:16px;
  padding:15px 5px;
  color:white;
  text-align:center;
  min-height:94px;
  font-size:12px;
  font-weight:800;
  transition:.2s;
}

.action:active,.service:active{
  transform:scale(.97);
}

.action .ico{
  display:block;
  font-size:24px;
  margin-bottom:8px;
}

.services{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.service{
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  padding:17px 12px;
  background:linear-gradient(135deg,#153764,#0c2040);
  border:1px solid #2b5689;
  border-radius:17px;
  color:white;
  min-height:92px;
  box-shadow:0 8px 25px #0002;
}

.service .ico{
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
  border-radius:14px;
  background:linear-gradient(145deg,#286ec0,#173c70);
  font-size:21px;
  flex-shrink:0;
}

.service strong{font-size:13px}

.service small{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:5px;
  line-height:1.5;
}

.panel{
  background:linear-gradient(145deg,#10284b,#0a1d39);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  box-shadow:var(--shadow);
}

.tx{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:14px 2px;
  border-bottom:1px solid #29436a;
}

.tx:last-child{border:0}

.tx-title{
  font-size:12px;
  font-weight:800;
}

.tx-date{
  font-size:10px;
  color:var(--muted);
  margin-top:5px;
}

.tx-amount{
  text-align:right;
  font-size:12px;
  font-weight:900;
}

.tx-status{
  font-size:10px;
  color:var(--green);
  margin-top:5px;
  text-align:right;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:5;
  background:#071832ed;
  backdrop-filter:blur(16px);
  border-top:1px solid #294875;
  display:flex;
  justify-content:center;
}

.nav{
  width:min(650px,100%);
  display:flex;
  justify-content:space-around;
  padding:10px 4px 13px;
}

.nav button{
  background:none;
  color:#9fb5d5;
  font-size:10px;
  min-width:62px;
}

.nav button span{
  display:block;
  font-size:20px;
  margin-bottom:4px;
}

.nav button.active{color:var(--cyan)}

.support{
  position:fixed;
  right:17px;
  bottom:85px;
  z-index:7;
  width:55px;
  height:55px;
  border-radius:50%;
  background:linear-gradient(145deg,#55dcff,#287cff);
  color:white;
  box-shadow:0 8px 28px #0008;
  font-size:24px;
  border:2px solid #ffffff50;
}

.modal-back{
  position:fixed;
  inset:0;
  background:#020916e8;
  z-index:10;
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:10px;
}

.modal-back.show{display:flex}

.modal{
  width:min(620px,100%);
  max-height:92vh;
  overflow:auto;
  background:linear-gradient(155deg,#163967,#0a1c38 75%);
  border:1px solid #3a6598;
  border-radius:23px;
  padding:20px;
  margin-bottom:8px;
  box-shadow:0 20px 70px #000a;
}

.modal h3{
  margin:0 0 7px;
  font-size:19px;
}

.modal label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin:14px 0 7px;
}

.modal input,.modal select{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #42618c;
  background:#071832;
  color:white;
  outline:none;
}

.modal input:focus,.modal select:focus{
  border-color:var(--cyan);
  box-shadow:0 0 0 3px #55dcff18;
}

.primary{
  width:100%;
  padding:15px;
  border-radius:13px;
  background:linear-gradient(90deg,#287cff,#159fe4);
  color:white;
  font-weight:900;
  margin-top:15px;
  box-shadow:0 7px 20px #287cff35;
}

.secondary{
  padding:11px 14px;
  border-radius:11px;
  background:#214674;
  color:white;
  font-weight:800;
  margin:9px 6px 0 0;
}

.close{
  float:right;
  background:#203e69;
  color:white;
  border-radius:50%;
  width:32px;
  height:32px;
  font-size:20px;
}

.result{
  margin-top:13px;
  padding:14px;
  border-radius:13px;
  background:#071832;
  border:1px solid #23466f;
  color:#dceaff;
  font-size:12px;
  line-height:1.8;
  overflow-wrap:anywhere;
}

.hidden{display:none!important}

.status{
  margin-top:13px;
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}

.danger{color:var(--red)}
.good{color:var(--green)}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.listing{
  padding:14px;
  margin-top:11px;
  border:1px solid #345b88;
  border-radius:14px;
  background:#0a1d39;
}

.listing strong{font-size:13px}

.listing p{
  font-size:11px;
  color:var(--muted);
  margin:7px 0;
}

.listing .price{
  font-weight:900;
  color:white;
  margin-top:9px;
}

.pill{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#173e6b;
  color:#bdeaff;
  font-size:10px;
  margin:4px 3px 0 0;
}

.orderbox{
  padding:14px;
  border:1px solid #3a6598;
  border-radius:14px;
  background:#071832;
  margin-top:12px;
  font-size:12px;
  line-height:1.8;
}

.price-toggle{
  background:transparent;
  color:var(--cyan);
  border:0;
  font-size:11px;
  padding:5px 0;
}

.live{color:var(--green)}
.offline{color:var(--red)}

@media(min-width:700px){
  .welcome h1{font-size:34px}
  .wallet{padding:23px;min-height:165px}
  .wallet-value{font-size:29px}
  .services{grid-template-columns:repeat(3,1fr)}
  .modal-back{align-items:center}
}

@media(max-width:370px){
  .wallet-value{font-size:19px}
  .action{font-size:11px}
  .service{gap:8px;padding:12px 9px}
  .service .ico{width:36px;height:36px}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header class="top">
  <div class="brand">Speedy<span>.ng</span></div>
  <button class="profile" id="profileBtn" aria-label="Profile">👤</button>
</header>

<main id="top">

<section class="welcome">
  <div class="eyebrow">YOUR DIGITAL SERVICES HUB</div>
  <h1>Welcome back 👋</h1>
  <div class="muted" id="email">Loading your account…</div>
</section>

<div class="section-head">
  <h2>My Wallet</h2>
  <button class="text-btn" id="refreshBtn">↻ Refresh</button>
</div>

<section class="wallets">
  <div class="wallet">
    <span class="wallet-symbol">🇳🇬</span>
    <div class="wallet-label">Naira balance</div>
    <div class="wallet-value" id="ngn">₦0.00</div>
    <div class="wallet-foot">NGN wallet</div>
  </div>

  <div class="wallet usd">
    <span class="wallet-symbol">🇺🇸</span>
    <div class="wallet-label">Dollar balance</div>
    <div class="wallet-value" id="usd">$0.00</div>
    <div class="wallet-foot">USD wallet</div>
  </div>
</section>

<div class="section-head">
  <h2>Quick actions</h2>
</div>

<section class="actions">
  <button class="action" id="depositOpen">
    <span class="ico">＋</span>Deposit
  </button>
  <button class="action" id="convertOpen">
    <span class="ico">⇄</span>Convert
  </button>
  <button class="action" data-scroll="transactions">
    <span class="ico">▤</span>Transactions
  </button>
</section>

<div class="section-head" id="services">
  <h2>Explore services</h2>
</div>

<section class="services">
  <button class="service" id="numbersOpen">
    <span class="ico">📱</span>
    <span>
      <strong>Buy Numbers</strong>
      <small>Live countries, services and available stock</small>
    </span>
  </button>

  <button class="service" id="boostOpen">
    <span class="ico">🚀</span>
    <span>
      <strong>Social Boosting</strong>
      <small>Service connection status</small>
    </span>
  </button>

  <button class="service" id="logsOpen">
    <span class="ico">📁</span>
    <span>
      <strong>Social Logs</strong>
      <small>Browse available listings</small>
    </span>
  </button>
</section>

<div class="section-head" id="transactions">
  <h2>Recent transactions</h2>
  <button class="text-btn" id="txRefresh">Refresh</button>
</div>

<section class="panel" id="transactionList">
  <div class="muted">Loading transactions…</div>
</section>

<div class="status" id="pageStatus">Connecting securely…</div>

</main>

<nav class="bottom">
  <div class="nav">
    <button class="active" data-scroll="top"><span>⌂</span>Home</button>
    <button data-scroll="services"><span>▦</span>Services</button>
    <button data-scroll="transactions"><span>▤</span>Activity</button>
    <button id="navProfile"><span>☻</span>Profile</button>
  </div>
</nav>

<button class="support" id="supportBtn" aria-label="Support">☏</button>

<div class="modal-back" id="modalBack">
  <section class="modal" role="dialog" aria-modal="true">
    <button class="close" id="closeModal">×</button>
    <h3 id="modalTitle">Wallet</h3>
    <p class="muted" id="modalIntro"></p>
    <div id="modalBody"></div>
    <div id="modalStatus" class="status" aria-live="polite"></div>
  </section>
</div>
<script>
"use strict";

const API="https://speedy-ng-api-staging.unicespotify.workers.dev";

const token=
  localStorage.getItem("speedy_customer_token")||
  sessionStorage.getItem("speedy_customer_token");

const $=id=>document.getElementById(id);

let customer={};
let walletData={};
let depositPoll=null;
let activeDeposit=null;
let numberCountries=[];
let numberServices=[];
let selectedQuote=null;
let logListings=[];
let debounceTimer=null;

const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
}[c]));

const money=(v,c="USD")=>
  (c==="NGN"?"₦":"$")+
  Number(v||0).toLocaleString(
    c==="NGN"?"en-NG":"en-US",
    {minimumFractionDigits:2,maximumFractionDigits:2}
  );

const key=()=>
  ("sp"+Date.now()+Math.random().toString(36).slice(2,14))
  .replace(/[^a-zA-Z0-9._:-]/g,"")
  .slice(0,60);

async function api(path,method="GET",body,headers={}){
  const r=await fetch(API+path,{
    method,
    headers:{
      Authorization:"Bearer "+token,
      Accept:"application/json",
      ...(body?{"Content-Type":"application/json"}:{}),
      ...headers
    },
    ...(body?{body:JSON.stringify(body)}:{})
  });

  let d={};
  try{d=await r.json()}catch{}

  if(!r.ok||d.ok===false||d.success===false){
    throw Error(d.message||d.error||`Request failed (${r.status})`);
  }

  return d;
}

function status(t,bad=false){
  $("pageStatus").textContent=t;
  $("pageStatus").className="status"+(bad?" danger":"");
}

function modal(title,intro,html){
  clearInterval(depositPoll);
  $("modalTitle").textContent=title;
  $("modalIntro").textContent=intro||"";
  $("modalBody").innerHTML=html;
  $("modalStatus").textContent="";
  $("modalStatus").className="status";
  $("modalBack").classList.add("show");
}

function closeModal(){
  clearInterval(depositPoll);
  depositPoll=null;
  $("modalBack").classList.remove("show");
}

$("closeModal").onclick=closeModal;

$("modalBack").addEventListener("click",e=>{
  if(e.target===$("modalBack"))closeModal();
});

/* CUSTOMER ACCOUNT AND WALLETS */

async function refreshAll(){
  if(!token){
    location.replace("/");
    return;
  }

  try{
    const [m,w,t]=await Promise.all([
      api("/api/customer/me"),
      api("/api/customer/wallet"),
      api("/api/customer/wallet/transactions")
    ]);

    customer=m.customer||{};
    walletData=w;

    $("email").textContent=customer.email||"Your Speedy.ng account";
    $("ngn").textContent=money(w.balances?.NGN,"NGN");
    $("usd").textContent=money(w.balances?.USD,"USD");

    renderTx(t.transactions||[]);
    status("Your wallet and account are up to date.");

  }catch(e){
    status(e.message,true);

    if(/unauthori[sz]ed|token|session|login/i.test(e.message)){
      setTimeout(()=>location.replace("/"),1000);
    }
  }
}

function renderTx(rows){
  $("transactionList").innerHTML=rows.length
    ?rows.slice(0,15).map(x=>`
      <div class="tx">
        <div>
          <div class="tx-title">${esc(x.description||x.type||"Wallet transaction")}</div>
          <div class="tx-date">${esc(x.created_at||"")}</div>
        </div>
        <div>
          <div class="tx-amount">
            ${esc(money(Number(x.amount_minor||0)/100,x.currency||"NGN"))}
          </div>
          <div class="tx-status">${esc(x.status||"Pending")}</div>
        </div>
      </div>
    `).join("")
    :'<div class="muted">No transactions yet. Your activity will appear here.</div>';
}

/* WALLET DEPOSIT */

function deposit(){
  modal(
    "Add money",
    "Make a secure Flutterwave payment. Your wallet should update after the backend verifies the payment.",
    `
      <label>Amount in naira (₦)</label>
      <input id="depAmount" type="number" min="100" max="5000000" step=".01" placeholder="Enter amount">
      <button class="primary" id="depCreate">Continue to payment</button>
    `
  );

  $("depCreate").onclick=createDeposit;
}

async function createDeposit(){
  const amount=Number($("depAmount").value);

  if(
    !Number.isFinite(amount)||
    amount<100||
    amount>5000000||
    Math.round(amount*100)!==amount*100
  ){
    $("modalStatus").textContent="Enter ₦100 to ₦5,000,000, up to 2 decimal places.";
    return;
  }

  const b=$("depCreate");
  b.disabled=true;
  b.textContent="Creating secure payment…";

  try{
    const d=await api(
      "/api/customer/wallet/deposit",
      "POST",
      {amount}
    );

    activeDeposit={
      reference:d.reference,
      amount:Number(d.amount??amount)
    };

    const p=d.paymentInstructions||{};

    $("modalBody").innerHTML=`
      <div class="orderbox">
        <span class="pill">FLUTTERWAVE BANK TRANSFER</span>
        <h3>${esc(money(activeDeposit.amount,"NGN"))}</h3>

        <p class="muted">Bank name</p>
        <strong>${esc(p.bankName||"Not provided")}</strong>

        <p class="muted">Account name</p>
        <strong>${esc(p.accountName||"Speedy.ng")}</strong>

        <p class="muted">Account number</p>
        <strong style="font-size:22px">${esc(p.accountNumber||"Not provided")}</strong>

        <p class="muted">Payment reference</p>
        <strong>${esc(d.reference||"")}</strong>

        <p class="muted">
          Transfer the exact amount shown. Your wallet will be credited
          after Flutterwave confirms payment.
        </p>
      </div>

      <button class="secondary" id="depCheck">Check payment status</button>
      <button class="secondary" id="depDone">Close</button>
    `;
$("depDone").onclick=closeModal;
    $("depCheck").onclick=checkDeposit;
    startDepositPoll();
  }catch(e){
    $("modalStatus").textContent=e.message;
    $("modalStatus").className="status danger";
  }finally{
    b.disabled=false;
    b.textContent="Continue to payment";
  }
}

function startDepositPoll(){
  clearInterval(depositPoll);
  depositPoll=setInterval(checkDeposit,7000);
}

async function checkDeposit(){
  if(!activeDeposit)return;

  try{
    const [w,t]=await Promise.all([
      api("/api/customer/wallet"),
      api("/api/customer/wallet/transactions")
    ]);

    walletData=w;

    $("ngn").textContent=money(w.balances?.NGN,"NGN");
    $("usd").textContent=money(w.balances?.USD,"USD");

    renderTx(t.transactions||[]);

    const expectedMinor=Math.round(activeDeposit.amount*100);
    const reference=String(activeDeposit.reference||"");

    const match=(t.transactions||[]).find(x=>{
      const refs=[
        String(x.reference||""),
        String(x.payment_reference||""),
        String(x.reference||"").replace(/^FLW-/,"")
      ];

      return refs.includes(reference)&&
        Number(x.amount_minor)===expectedMinor&&
        String(x.currency||"").toUpperCase()==="NGN"&&
        ["successful","completed","success"].includes(
          String(x.status||"").toLowerCase()
        );
    });

    if(match){
      $("depState").textContent="Payment confirmed. Your wallet transaction is recorded.";
      $("depState").className="good";
      clearInterval(depositPoll);
      depositPoll=null;
      setTimeout(closeModal,2500);
    }else{
      $("depState").textContent="We are still waiting for verified payment confirmation. Do not pay again until you check your payment status.";
    }

  }catch(e){
    $("depState").textContent="Unable to check right now. Please try again shortly.";
  }
}

/* CURRENCY CONVERSION */

function convert(){
  const rate=Number(walletData.rate||1500);

  modal(
    "Convert currency",
    "Move money between your NGN and USD wallets.",
    `
      <label>Convert from</label>
      <select id="convFrom">
        <option value="NGN">🇳🇬 NGN wallet</option>
        <option value="USD">🇺🇸 USD wallet</option>
      </select>

      <label>Amount</label>
      <input id="convAmount" type="number" min=".01" step=".01" placeholder="Enter amount">

      <p class="muted">Configured rate: ₦${rate.toLocaleString("en-NG")} = $1.00</p>

      <button class="primary" id="convGo">Convert funds</button>
    `
  );

  $("convGo").onclick=async()=>{
    const from=$("convFrom").value;
    const amount=Number($("convAmount").value);

    if(!(amount>0)||Math.round(amount*100)!==amount*100){
      $("modalStatus").textContent="Enter a valid amount with up to 2 decimal places.";
      return;
    }

    const b=$("convGo");
    b.disabled=true;

    try{
      const d=await api(
        "/api/customer/wallet/convert",
        "POST",
        {
          from,
          to:from==="NGN"?"USD":"NGN",
          amount_minor:Math.round(amount*100)
        }
      );

      $("modalStatus").textContent=d.message||"Conversion completed.";
      $("modalStatus").className="status good";
      await refreshAll();

    }catch(e){
      $("modalStatus").textContent=e.message;
      $("modalStatus").className="status danger";
    }finally{
      b.disabled=false;
    }
  };
}

/* SHARED DATA HELPERS */

function unwrap(x){
  if(Array.isArray(x))return x;
  if(!x||typeof x!=="object")return [];

  for(const k of [
    "data","results","items","countries",
    "services","listings","categories","prices"
  ]){
    if(Array.isArray(x[k]))return x[k];
  }

  return [];
}

function label(x){
  return String(
    x?.name??
    x?.title??
    x?.country_name??
    x?.country??
    x?.service_name??
    x?.service??
    x?.slug??
    x?.code??
    ""
  ).trim();
}

function optionValue(x){
  return String(x?.code??x?.id??x?.iso??x?.slug??label(x));
}
/* VISUAL NUMBERS */

function showNumbers(){
  modal(
    "Buy Numbers",
    "Search for a country and service. Availability and price are checked before purchase.",
    `
      <label>Search country</label>
      <input id="countrySearch" placeholder="Type a country name">

      <label>Country</label>
      <select id="countrySelect">
        <option value="">Loading countries…</option>
      </select>

      <label>Search service</label>
      <input id="serviceSearch" placeholder="Type a service name">

      <label>Service</label>
      <select id="serviceSelect">
        <option value="">Loading services…</option>
      </select>

      <div id="numberQuote" class="result">
        Choose a country and service to check availability.
      </div>

      <button class="primary" id="numberBuy" disabled>Buy number</button>
      <div id="numberOrder"></div>
    `
  );

  loadNumbers();
}

async function loadNumbers(){
  try{
    const [c,s]=await Promise.all([
      api("/api/customer/visual-numbers/countries"),
      api("/api/customer/visual-numbers/services")
    ]);

    numberCountries=unwrap(c.countries||c);
    numberServices=unwrap(s.services||s);

    fillSelect("countrySelect",numberCountries);
    fillSelect("serviceSelect",numberServices);

    $("countrySearch").oninput=()=>{
      filterSelect("countrySelect",numberCountries,$("countrySearch").value);
    };

    $("serviceSearch").oninput=()=>{
      filterSelect("serviceSelect",numberServices,$("serviceSearch").value);
    };

    $("countrySelect").onchange=loadQuote;
    $("serviceSelect").onchange=loadQuote;
    $("numberBuy").onclick=buyNumber;

    if(!numberCountries.length||!numberServices.length){
      throw Error("The live country or service list is empty. Please refresh later.");
    }

  }catch(e){
    $("numberQuote").textContent=e.message;
  }
}

function fillSelect(id,rows){
  const select=$(id);
  const old=select.value;

  select.innerHTML=`
    <option value="">Select an option</option>
    ${rows.map((x,i)=>`
      <option value="${esc(optionValue(x))}">
        ${esc(label(x)||`Option ${i+1}`)}
      </option>
    `).join("")}
  `;

  if(rows.some(x=>optionValue(x)===old))select.value=old;
}

function filterSelect(id,rows,q){
  const search=String(q||"").trim().toLowerCase();

  const filtered=!search
    ?rows
    :rows.filter(x=>{
      const searchable=[
        label(x),
        x?.name,
        x?.title,
        x?.country,
        x?.country_name,
        x?.service,
        x?.service_name,
        x?.code,
        x?.id,
        x?.slug
      ].filter(Boolean).join(" ").toLowerCase();

      return searchable.includes(search);
    });

  fillSelect(id,filtered);

  if(!$(id).value){
    loadQuote();
  }
}

async function loadQuote(){
  const c=$("countrySelect").value;
  const s=$("serviceSelect").value;

  selectedQuote=null;
  $("numberBuy").disabled=true;

  if(!c||!s){
    $("numberQuote").textContent="Choose a country and service to check availability.";
    return;
  }

  $("numberQuote").textContent="Checking live price and availability…";

  try{
    const d=await api(
      `/api/customer/visual-numbers/quote?country=${encodeURIComponent(c)}&service=${encodeURIComponent(s)}`
    );

    const q=d.quote||{};
    const priceMinor=Number(q.customer_price_minor);
    const stock=q.stock??null;
    const currency=q.currency||"USD";

    if(!Number.isFinite(priceMinor)||priceMinor<=0){
      throw Error("A valid price is not currently available for this service.");
    }

    const price=priceMinor/100;
    const rate=Number(walletData.rate||1500);
    const stockNumber=Number(stock);
const stockKnown=stock!==null&&stock!==undefined&&
  stock!==""&&Number.isFinite(stockNumber);
const available=stockKnown&&stockNumber>0;

    selectedQuote={country:c,service:s,priceMinor,stock,currency};

    const ngnEquivalent=currency==="USD"
      ?money(price*rate,"NGN")
      :"";

    const countryName=label(numberCountries.find(x=>optionValue(x)===c))||c;
    const serviceName=label(numberServices.find(x=>optionValue(x)===s))||s;

    $("numberQuote").innerHTML=`
      <strong>${esc(countryName)} · ${esc(serviceName)}</strong>
      <br><br>
      Price: <strong>${esc(money(price,currency))}</strong>
      ${ngnEquivalent?`
        <br>
        <button class="price-toggle" id="showNgn">⌄ Show NGN price</button>
        <div id="ngnEquivalent" class="hidden">${esc(ngnEquivalent)}</div>
      `:""}
      <br>
      Availability:
      <strong class="${!stockKnown?"":available?"live":"offline"}">
        ${!stockKnown?"UNKNOWN":available?"ONLINE":"OFFLINE"}
      </strong>
      <br>
      Available stock: <strong>${stockKnown?stockNumber:"Not confirmed"}</strong>
      <br>
      <span class="muted">The backend must verify the final price and stock again before charging your wallet.</span>
    `;

    if(ngnEquivalent){
      $("showNgn").onclick=()=>{
        const box=$("ngnEquivalent");
        box.classList.toggle("hidden");
        $("showNgn").textContent=box.classList.contains("hidden")
          ?"⌄ Show NGN price"
          :"⌃ Hide NGN price";
      };
    }

    $("numberBuy").disabled=stockKnown&&Number(stock)<=0;

  }catch(e){
    $("numberQuote").textContent=e.message;
  }
}

async function buyNumber(){
  if(!selectedQuote)return;

  const b=$("numberBuy");
  b.disabled=true;
  b.textContent="Requesting number…";

  const idempotencyKey=key();

  try{
    const d=await api(
      "/api/customer/visual-numbers/purchase",
      "POST",
      {
        country:selectedQuote.country,
        service:selectedQuote.service,
        idempotency_key:idempotencyKey
      },
      {"Idempotency-Key":idempotencyKey}
    );

    const o=d.order||{};

    $("numberOrder").innerHTML=`
      <div class="orderbox">
        <strong>${esc(d.message||"Number order created")}</strong>
        <br><br>
        Phone:
        <strong>${esc(o.phone_number||o.provider_phone||d.delivery?.phone_number||"Waiting for number")}</strong>
        <br>
        Order: ${esc(o.id||d.order_id||"")}
        <br>
        Status: ${esc(o.status||d.status||"processing")}
        <br>
        <button class="secondary" id="checkNumber">Check SMS code</button>
      </div>
    `;

    $("checkNumber").onclick=()=>checkNumber(o.id||d.order_id);
    await refreshAll();

  }catch(e){
    $("numberOrder").innerHTML=`<div class="result danger">${esc(e.message)}</div>`;
  }finally{
    b.disabled=false;
    b.textContent="Buy number";
  }
}

async function checkNumber(id){
  if(!id)return;

  try{
    const d=await api(
      `/api/customer/visual-numbers/orders/${encodeURIComponent(id)}/check`,
      "POST",
      {}
    );

    const o=d.order||{};

    $("numberOrder").innerHTML=`
      <div class="orderbox">
        Status: ${esc(d.status||o.status||"checking")}
        <br>
        Phone: ${esc(o.phone_number||o.provider_phone||"")}
        <br>
        SMS code:
        <strong class="good">${esc(d.delivery?.sms_code||o.sms_code||"Not received yet")}</strong>
        <br>
        ${esc(d.message||"Refresh to check again.")}
        <br>
        <button class="secondary" id="checkNumber">Check again</button>
      </div>
    `;

    $("checkNumber").onclick=()=>checkNumber(id);
    await refreshAll();

  }catch(e){
    $("numberOrder").innerHTML=`<div class="result">${esc(e.message)}</div>`;
  }
}

/* SOCIAL LOGS */

function showLogs(){
  modal(

}

async function loadLogs(){
  try{
    const c=await api("/api/customer/social-logs/categories");
    const cats=unwrap(c.categories||c);

    $("logCategory").innerHTML=
      '<option value="">All categories</option>'+
      cats.map(x=>`
        <option value="${esc(x.id??x.category_id??x.slug??"")}">
          ${esc(label(x))}
        </option>
      `).join("");

    $("logCategory").onchange=fetchLogs;
    $("logSearch").oninput=()=>debounce(fetchLogs,450);

    await fetchLogs();

  }catch(e){
    $("logList").textContent=e.message;
  }
}

function debounce(fn,ms){
  clearTimeout(debounceTimer);
  debounceTimer=setTimeout(fn,ms);
}

async function fetchLogs(){
  try{
    const q=new URLSearchParams({per_page:"50",page:"1"});

    if($("logSearch").value)q.set("search",$("logSearch").value);
    if($("logCategory").value)q.set("category_id",$("logCategory").value);

    const d=await api("/api/customer/social-logs/listings?"+q.toString());

    logListings=unwrap(d.listings||d);

    $("logList").innerHTML=logListings.length
      ?logListings.map(x=>{
        const title=x.title||x.name||x.slug||"Social Log";
        const slug=x.slug||x.listing_slug||x.id;

        return `
          <article class="listing">
            <strong>${esc(title)}</strong>
            <p>${esc(x.category_name||x.category||"Available listing")}</p>
            <p>Stock: ${esc(x.available_stock??x.stock??"Check at purchase")}</p>
            <div class="price">
              ${x.customer_price_minor
                ?esc(money(x.customer_price_minor/100,"USD"))
                :"Price checked at checkout"}
            </div>
            <button class="secondary" data-log="${esc(slug)}">View & purchase</button>
          </article>
        `;
      }).join("")
      :'<div class="result">No matching listings were returned. Try another search.</div>';

    $("logList").querySelectorAll("[data-log]").forEach(b=>{
      b.onclick=()=>inspectLog(b.dataset.log);
    });

  }catch(e){
    $("logList").textContent=e.message;
  }
}

async function inspectLog(slug){
  try{
    const x=logListings.find(item=>
      String(item.slug||item.listing_slug||item.id)===String(slug)
    )||{};

    const title=x.title||x.name||slug;
    const price=Number(x.customer_price_minor||0);

    $("logList").innerHTML=`
      <div class="listing">
        <strong>${esc(title)}</strong>
        <p>${esc(x.description||x.category_name||"Social Logs listing")}</p>
        <p>Available stock: ${esc(x.available_stock??x.stock??"Check at purchase")}</p>
        <div class="price">
          ${price?esc(money(price/100,"USD")):"Price verified at checkout"}
        </div>

        <label>Quantity (1–10)</label>
        <input id="logQty" type="number" min="1" max="10" value="1">

        <button class="primary" id="logBuy">Purchase with USD wallet</button>
        <div id="logPurchaseResult"></div>
        <button class="secondary" id="backLogs">Back to listings</button>
      </div>
    `;

    $("backLogs").onclick=fetchLogs;

    $("logBuy").onclick=async()=>{
      const qty=Number($("logQty").value);

      if(!Number.isInteger(qty)||qty<1||qty>10){
        $("logPurchaseResult").textContent="Quantity must be 1–10.";
        return;
      }

      const b=$("logBuy");
      b.disabled=true;
      b.textContent="Processing securely…";

      const idempotencyKey=key();

      try{
        const d=await api(
          "/api/customer/social-logs/purchase",
          "POST",
          {slug,quantity:qty,idempotency_key:idempotencyKey},
          {"Idempotency-Key":idempotencyKey}
        );

        const accounts=d.delivery?.accounts||[];

        $("logPurchaseResult").innerHTML=`
          <div class="orderbox">
            <strong>${esc(d.message||"Order received")}</strong>
            <br>
            Order ID: ${esc(d.order?.id||d.order_id||"")}
            <br>
            Status: ${esc(d.order?.status||d.status||"processing")}
            ${accounts.map(a=>`
              <p>${esc(typeof a==="string"?a:JSON.stringify(a))}</p>
            `).join("")}
          </div>
        `;

        await refreshAll();

      }catch(e){
        $("logPurchaseResult").innerHTML=
          `<div class="result danger">${esc(e.message)}</div>`;
      }finally{
        b.disabled=false;
        b.textContent="Purchase with USD wallet";
      }
    };

  }catch(e){
    $("logList").textContent=e.message;
  }
}
